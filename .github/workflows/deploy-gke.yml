name: Deploy to GKE Autopilot

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: 'GCP Project ID (Leave blank to use repo var/default)'
        required: false
        default: ''
      gcp_region:
        description: 'GCP Region'
        required: false
        default: 'us-central1'
      gke_cluster:
        description: 'GKE Cluster Name'
        required: false
        default: 'aiservice-solana-transactions-autopilot-cluster'

permissions:
  contents: read
  id-token: write # Required for Google Workload Identity Federation

env:
  GCP_PROJECT_ID: ${{ github.event.inputs.gcp_project_id || vars.GCP_PROJECT_ID || 'aiservice-solana-transactions' }}
  GCP_REGION: ${{ github.event.inputs.gcp_region || vars.GCP_REGION || 'us-central1' }}
  GKE_CLUSTER: ${{ github.event.inputs.gke_cluster || vars.GKE_CLUSTER || 'autopilot-cluster' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'solana-transactions' }}

jobs:
  deploy:
    name: Build, Push & Deploy to GKE Autopilot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ===================================================================
      # 1. Authenticate to Google Cloud
      # Supports either Workload Identity Federation (recommended) or SA Key JSON
      # ===================================================================
      - name: Authenticate to Google Cloud (Workload Identity)
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Authenticate to Google Cloud (Service Account Key Fallback)
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ===================================================================
      # 2. Connect to GKE Autopilot Cluster
      # ===================================================================
      - name: Get GKE Autopilot Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ===================================================================
      # 3. Build and Push Docker Images to Google Artifact Registry
      # ===================================================================
      - name: Set Image Names
        run: |
          GAR_BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}"
          echo "BE_IMAGE=${GAR_BASE}/be" >> $GITHUB_ENV
          echo "FE_IMAGE=${GAR_BASE}/fe" >> $GITHUB_ENV
          echo "TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: |
            ${{ env.BE_IMAGE }}:${{ env.TAG }}
            ${{ env.BE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          file: ./fe/Dockerfile
          push: true
          tags: |
            ${{ env.FE_IMAGE }}:${{ env.TAG }}
            ${{ env.FE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===================================================================
      # 4. Provision Kubernetes Secrets (if configured in GitHub Secrets)
      # ===================================================================
      - name: Apply / Update Kubernetes Secrets
        run: |
          # Create namespace if it does not already exist
          kubectl create namespace solana-transactions --dry-run=client -o yaml | kubectl apply -f -

          # Create or update application secrets if provided in GitHub Secrets
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            kubectl create secret generic solana-transactions-secrets \
              --namespace=solana-transactions \
              --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "DATABASE_URL secret not provided in GitHub Secrets, checking if secret exists in cluster..."
            if ! kubectl get secret solana-transactions-secrets -n solana-transactions > /dev/null 2>&1; then
              echo "Creating default in-cluster DB secret..."
              kubectl create secret generic solana-transactions-secrets \
                --namespace=solana-transactions \
                --from-literal=DATABASE_URL="postgres://postgres:postgres_secure_pass@solana-transactions-db:5432/solana_transactions_db" \
                --dry-run=client -o yaml | kubectl apply -f -
            fi
          fi

          # Optional custom RPC endpoint secret
          if [ -n "${{ secrets.SOLANA_RPC_URL }}" ]; then
            kubectl create secret generic solana-transactions-secrets \
              --namespace=solana-transactions \
              --from-literal=SOLANA_RPC_URL="${{ secrets.SOLANA_RPC_URL }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      # ===================================================================
      # 5. Deploy to GKE Autopilot via Kustomize
      # ===================================================================
      - name: Set Image Tags in Kustomize
        run: |
          cd k8s
          # Update kustomization.yaml image tags dynamically
          sed -i 's|newName: .*be.*|newName: '"${{ env.BE_IMAGE }}"'|g' kustomization.yaml
          sed -i 's|newTag: .*|newTag: '"${{ env.TAG }}"'|g' kustomization.yaml
          sed -i 's|newName: .*fe.*|newName: '"${{ env.FE_IMAGE }}"'|g' kustomization.yaml

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -k k8s/

      # ===================================================================
      # 6. Verify Rollout Status
      # ===================================================================
      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/solana-transactions-be -n solana-transactions --timeout=300s

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/solana-transactions-fe -n solana-transactions --timeout=300s

      - name: Display Deployment Endpoints & Status
        run: |
          echo "=========================================="
          echo "Deployment successful to GKE Autopilot!"
          echo "=========================================="
          kubectl get all,ingress -n solana-transactions
