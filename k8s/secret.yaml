apiVersion: v1
kind: Secret
metadata:
  name: solana-transactions-secrets
  namespace: solana-transactions
  labels:
    app.kubernetes.io/name: solana-transactions
    app.kubernetes.io/part-of: aiservice-solana-transactions
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgres_secure_pass@solana-transactions-db:5432/solana_transactions_db"
  POSTGRES_PASSWORD: "postgres_secure_pass"
  SOLANA_RPC_URL: "https://api.mainnet.solana.com"
