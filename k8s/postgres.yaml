apiVersion: v1
kind: Service
metadata:
  name: solana-transactions-db
  namespace: solana-transactions
  labels:
    app.kubernetes.io/name: solana-transactions-db
    app.kubernetes.io/part-of: aiservice-solana-transactions
spec:
  type: ClusterIP
  ports:
    - port: 5432
      name: postgresql
      targetPort: 5432
  selector:
    app.kubernetes.io/name: solana-transactions-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solana-transactions-db
  namespace: solana-transactions
  labels:
    app.kubernetes.io/name: solana-transactions-db
    app.kubernetes.io/part-of: aiservice-solana-transactions
spec:
  serviceName: solana-transactions-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solana-transactions-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solana-transactions-db
        app.kubernetes.io/part-of: aiservice-solana-transactions
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              value: "solana_transactions_db"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: solana-transactions-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "1Gi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U postgres -d solana_transactions_db
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U postgres -d solana_transactions_db
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 20Gi
