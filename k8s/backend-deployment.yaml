apiVersion: apps/v1
kind: Deployment
metadata:
  name: solana-transactions-be
  namespace: solana-transactions
  labels:
    app.kubernetes.io/name: solana-transactions-be
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: aiservice-solana-transactions
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: solana-transactions-be
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solana-transactions-be
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: aiservice-solana-transactions
    spec:
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/aiservice-solana-transactions/solana-transactions/be:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: solana-transactions-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: solana-transactions-secrets
                  key: DATABASE_URL
            - name: SOLANA_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: solana-transactions-secrets
                  key: SOLANA_RPC_URL
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "500Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "500Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: solana-transactions-be
  namespace: solana-transactions
  labels:
    app.kubernetes.io/name: solana-transactions-be
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: aiservice-solana-transactions
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: solana-transactions-be
